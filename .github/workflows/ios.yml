name: iPhone build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    name: Export the Xcode project
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - uses: ./.github/actions/setup-godot
        with:
          templates: "true"

      - name: Import
        run: godot --headless --path game --import

      - name: Export
        run: |
          mkdir -p ios
          godot --headless --path game --export-release "iOS" "$PWD/ios/game.ipa"
          ls -la ios
          # A tarball keeps the frameworks' links and file modes, which an artifact's zip would lose.
          tar -czf ios-project.tar.gz -C ios .

      - name: Upload the project
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-project
          path: ios-project.tar.gz
          if-no-files-found: error
          compression-level: 0

  upload:
    name: Sign and upload to TestFlight
    needs: export
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Download the project
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-project

      - name: Sign, archive and upload
        run: bash .github/scripts/build_ios.sh ios-project.tar.gz
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
